server:
  port: ${PORT:3004}

spring:
  application:
    name: payment-service

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      # Flyway owns the schema; never let Hibernate mutate it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      # Commit offsets only after the handler returns, so a failed processing
      # attempt is redelivered (the consumer is idempotent on order_id).
      ack-mode: record

# Outbound payment gateway. PAYMENT_GATEWAY_URL points at the Toxiproxy
# listener rather than the gateway directly, so latency/failures are injected at
# the network layer.
payment:
  gateway:
    url: ${PAYMENT_GATEWAY_URL:http://localhost:3005}
    connect-timeout-ms: 2000
    # Must sit between a healthy call (~200ms, and slower on a cold JVM) and the
    # timeout toxic (10s), so an injected stall surfaces as TIMEOUT while normal
    # calls never do. 4s was too tight: cold-start calls tripped it with no
    # chaos active, which is indistinguishable from a real injected fault.
    read-timeout-ms: 8000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    # The OTel Java agent puts the active span's ids into the logback MDC as
    # trace_id/span_id; Spring Boot's default console pattern renders this
    # correlation fragment, so `docker logs` shows the same ids Tempo and Loki
    # key on. order_id and service are already in the message text; to Loki the
    # ids travel as OTLP structured metadata.
    correlation: "[trace_id=%mdc{trace_id:-} span_id=%mdc{span_id:-}] "
