# ─── shared instrumentation config ───────────────────────────
# Every service exports OTLP to the collector at one endpoint; only
# OTEL_SERVICE_NAME differs per service, so the common vars are anchored here to
# keep the service blocks below DRY. Application code never names
# Tempo/Loki/Prometheus — swapping a backend is a collector-config change.
x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=ecommerce,deployment.environment=local

# The Java agent defaults all three signal exporters to OTLP already; setting
# them explicitly keeps the behaviour visible here rather than implied.
x-otel-java-env: &otel-java-env
  <<: *otel-env
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: otlp

# ─── infra ───────────────────────────────────

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Host access for psql / IDE debugging
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Exposes PostgreSQL internals (connection counts, lock waits, transaction
  # rates) as Prometheus metrics. --auto-discover-databases fans the exporter
  # out across all four per-service databases, not just the one it connects to.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/postgres?sslmode=disable
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "true"
    ports:
      # Host access for debugging the exporter directly (Prometheus scrapes it
      # over the internal network regardless).
      - "9187:9187"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      # enable 4 letter commands for healthcheck (srvr, ruok)
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=srvr,ruok"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      # Host access for local debugging (kcat, IDE runs)
      - "${KAFKA_EXTERNAL_PORT}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Dual listeners: INTERNAL for containers, EXTERNAL for the host
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Topics are provisioned explicitly by kafka-init; no auto-create
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test:
        [
          "CMD",
          "kafka-broker-api-versions",
          "--bootstrap-server",
          "localhost:9092",
        ]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["bash", "-c"]
    command: |
      "
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic order.created      --partitions 3 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic inventory.reserved --partitions 3 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic inventory.failed   --partitions 3 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic payment.success    --partitions 3 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic payment.failed     --partitions 3 --replication-factor 1 &&
      echo 'Topics ready:' &&
      kafka-topics --bootstrap-server kafka:29092 --list
      "
    restart: "no"

  # ─── Application services ───────────────────────────────────
  api-gateway:
    build: ./services/api-gateway
    container_name: api-gateway
    depends_on:
      order-service:
        condition: service_started
      product-catalog:
        condition: service_started
    ports:
      - "${API_GATEWAY_PORT}:8080"
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: api-gateway
      PORT: "8080"
      ORDER_SERVICE_URL: http://order-service:3000
      PRODUCT_CATALOG_URL: http://product-catalog:3001

  product-catalog:
    build: ./services/product-catalog
    container_name: product-catalog
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PRODUCT_CATALOG_PORT}:3001"
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: product-catalog
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/catalog_db?sslmode=disable
      PORT: "3001"

  order-service:
    build: ./services/order-service
    container_name: order-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      product-catalog:
        condition: service_started
    ports:
      - "${ORDER_SERVICE_PORT}:3000"
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: order-service
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/orders_db?sslmode=disable
      PORT: "3000"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PRODUCT_CATALOG_URL: http://product-catalog:3001

  inventory-service:
    build: ./services/inventory-service
    container_name: inventory-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "${INVENTORY_SERVICE_PORT}:3002"
    environment:
      <<: *otel-java-env
      OTEL_SERVICE_NAME: inventory-service
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/inventory_db?sslmode=disable
      PORT: "3002"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  payment-gateway:
    build: ./services/payment-gateway
    container_name: payment-gateway
    ports:
      - "${PAYMENT_GATEWAY_PORT}:3005"
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: payment-gateway
      PORT: "3005"

  # Transparent TCP proxy in front of the Payment Gateway. Starts with no
  # toxics, so it is a plain wire until chaos is injected at runtime through
  # the REST API on 8474 — see toxiproxy/scenarios.md.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    container_name: toxiproxy
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy-config.json"]
    depends_on:
      payment-gateway:
        condition: service_started
    ports:
      - "${TOXIPROXY_API_PORT}:8474"
      - "${TOXIPROXY_PAYMENT_PORT}:3105"
    volumes:
      - ./toxiproxy/toxiproxy-config.json:/config/toxiproxy-config.json:ro
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  payment-service:
    build: ./services/payment-service
    container_name: payment-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      toxiproxy:
        condition: service_healthy
    ports:
      - "${PAYMENT_SERVICE_PORT}:3004"
    environment:
      <<: *otel-java-env
      OTEL_SERVICE_NAME: payment-service
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/payments_db?sslmode=disable
      PORT: "3004"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Routed through Toxiproxy so network faults can be injected without
      # touching the gateway or this service.
      PAYMENT_GATEWAY_URL: http://toxiproxy:3105

  notification-service:
    build: ./services/notification-service
    container_name: notification-service
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "${NOTIFICATION_SERVICE_PORT}:3003"
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: notification-service
      PORT: "3003"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

# ─── observability (LGTM stack) ───────────────────────────────
# Services export OTLP to the collector only; the collector fans out to Tempo,
# Loki and Prometheus. Backends are never addressed directly by application
# code, so swapping one is a collector-config change.

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started
    ports:
      - "${OTEL_GRPC_PORT}:4317"
      - "${OTEL_HTTP_PORT}:4318"
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5

  tempo:
    image: grafana/tempo:2.6.0
    container_name: tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    user: "0:0"
    ports:
      - "${TEMPO_PORT}:3200"
    volumes:
      - ./observability/tempo-config.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo

  loki:
    image: grafana/loki:3.2.0
    container_name: loki
    command: ["-config.file=/etc/loki/loki.yaml"]
    user: "0:0"
    ports:
      - "${LOKI_PORT}:3100"
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Tempo's metrics generator remote-writes RED metrics here, and exemplars
      # are what make a latency spike link through to its trace.
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.2.2
    container_name: grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    ports:
      # Not 3000 on the host: order-service already owns that port.
      - "${GRAFANA_PORT}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      # Local-only convenience: skip the login screen entirely.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

volumes:
  postgres-data:
  tempo-data:
  loki-data:
  prometheus-data:
  grafana-data:

networks:
  default:
    name: ecommerce-observability
