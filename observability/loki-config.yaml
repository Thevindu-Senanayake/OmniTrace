# Loki — log storage. Single-binary with filesystem backend and no auth,
# appropriate for local development only.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Services push logs as they are produced; without a generous window a
  # clock skew between containers silently drops entries.
  reject_old_samples: false
  allow_structured_metadata: true
  volume_enabled: true
  # Retain a day of logs — long enough to investigate a chaos run, short
  # enough to keep the volume small.
  retention_period: 24h

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true

ruler:
  alertmanager_url: http://localhost:9093
