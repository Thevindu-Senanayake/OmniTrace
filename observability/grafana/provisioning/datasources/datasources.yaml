# Grafana datasources, provisioned so the stack comes up correlated rather
# than as three unrelated UIs.
#
# The links below are the entire point of the project: a latency spike in
# Prometheus leads to a trace in Tempo, and that trace leads to the log lines
# Loki captured for it.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST
      # Lets a histogram bucket carry a link to a sampled trace, which is what
      # makes a latency spike clickable rather than just visible.
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
          urlDisplayLabel: View trace

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # Trace → logs. Given a span, query Loki for the same service within the
      # span's time window and filter to the trace id carried in the log body.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        tags:
          - key: service.name
            value: service_name
        filterByTraceID: true
        filterBySpanID: false

      # Trace → metrics. Jump from a slow span to the request-rate/latency
      # series for that service.
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        tags:
          - key: service.name
            value: service

      # Service graph and RED metrics are generated by Tempo's
      # metrics_generator and written into Prometheus.
      serviceMap:
        datasourceUid: prometheus

      nodeGraph:
        enabled: true

      search:
        hide: false

      lokiSearch:
        datasourceUid: loki

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # Logs → trace. A log line reaches this link two different ways depending
      # on the emitter, so there are two matchers (see docs/events.md):
      derivedFields:
        # Primary path — Go (otelslog) and the Java agent attach the id to the
        # OTLP log record's trace context, which Loki 3.x stores as the
        # `trace_id` structured-metadata field, never in the body. A Label
        # matcher reads that key directly (requires Grafana 11.1+).
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          url: "$${__value.raw}"
          datasourceUid: tempo
          urlDisplayLabel: View trace
        # Fallback — Node logs the id inline as `trace_id=<hex>` in the message
        # body; match it there with a regex capture group.
        - name: TraceID
          matcherType: regex
          matcherRegex: '"?trace_?[iI]d"?[=:]\s*"?([a-f0-9]{32})"?'
          url: "$${__value.raw}"
          datasourceUid: tempo
          urlDisplayLabel: View trace
