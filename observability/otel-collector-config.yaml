# OpenTelemetry Collector — the single ingest point for the whole stack.
#
# Every service exports OTLP here rather than talking to Tempo/Loki/Prometheus
# directly. That keeps backend choice out of the services: swapping Tempo for
# Jaeger, or adding a second destination, is a change to this file only.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Bound memory before the batcher, so a traffic spike drops data here rather
  # than OOM-killing the collector and losing everything in flight.
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  batch:
    timeout: 5s
    send_batch_size: 1024

  # Fill in anything a service SDK left unset. Services set their own
  # service.name; this only guarantees the deployment dimension exists.
  resource:
    attributes:
      - key: deployment.environment
        value: local
        action: upsert

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  # Exposed for Prometheus to scrape rather than pushed, so Prometheus stays
  # the thing that decides scrape timing.
  prometheus:
    endpoint: 0.0.0.0:8889
    # Emit exemplars so a latency histogram bucket can link to an actual trace.
    # This is what makes "click the spike, land on the slow trace" work.
    enable_open_metrics: true
    resource_to_telemetry_conversion:
      enabled: true

  debug:
    verbosity: basic

service:
  # Health endpoint on 13133 backs the compose healthcheck; pprof and zpages
  # are for debugging the collector itself when a pipeline looks wrong.
  extensions: [health_check, pprof, zpages]

  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp/tempo]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/loki]

  telemetry:
    logs:
      level: info
    # Bind the collector's own metrics endpoint to all interfaces; the default
    # is localhost:8888, which is unreachable from Prometheus in another
    # container (the otel-collector-internal scrape target refuses otherwise).
    metrics:
      address: 0.0.0.0:8888

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777
  zpages:
    endpoint: 0.0.0.0:55679
