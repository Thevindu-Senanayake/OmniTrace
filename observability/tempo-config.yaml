# Tempo — trace storage. Single-binary, local filesystem: no object store, no
# clustering. Sized for a laptop demo, not production.

server:
  http_listen_port: 3200
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  # Flush quickly so a trace is queryable seconds after the request finishes.
  # Production would trade this latency for larger, more efficient blocks.
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Derives RED metrics (rate, errors, duration) from spans and pushes them to
# Prometheus. This is what lets a service graph and per-service latency exist
# without every service having to emit those metrics itself.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces

overrides:
  metrics_generator_processors:
    - service-graphs
    - span-metrics
