# ─── Global settings ─────────────────────────────────────────
global:
  # Docker Desktop shares the local Docker daemon with the cluster, so images
  # built by `docker compose build` are available without a registry.
  imagePullPolicy: IfNotPresent
  # Used by the init containers that gate each service on its dependencies.
  waitImage: busybox:1.36

# ─── Host access ─────────────────────────────────────────────
# Docker Desktop's kind-based cluster does not publish NodePorts to the Windows
# host, but it does publish LoadBalancer service ports — so the gateway is
# reached through an ingress controller rather than a NodePort. The controller
# itself is a cluster add-on and is not installed by this chart.
ingress:
  enabled: true
  className: nginx
  # Host-less rule: matches any Host header, so http://localhost/ works.
  host: ""
  annotations: {}

# ─── Data layer ──────────────────────────────────────────────
postgres:
  image: postgres:15-alpine
  # Credentials are rendered into a Secret; override in a values override file
  # or via --set for anything beyond local development.
  user: postgres
  password: postgres
  storage: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

# ─── Messaging (Kafka in KRaft mode — no Zookeeper) ──────────
kafka:
  image: confluentinc/cp-kafka:7.6.1
  clusterId: "MkU3OEVBNTcwNTJENDM2Qk"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  topics:
    - order.created
    - inventory.reserved
    - inventory.failed
    - payment.success
    - payment.failed
  partitions: 3
  replicationFactor: 1

# ─── Network chaos ───────────────────────────────────────────
# Transparent TCP proxy in front of the Payment Gateway. It is always in the
# payment path but starts with no toxics, so it behaves as a plain wire until
# faults are injected through the REST API on apiPort — no redeploy needed, and
# a clean baseline is preserved. See toxiproxy/scenarios.md.
toxiproxy:
  image: ghcr.io/shopify/toxiproxy:2.9.0
  apiPort: 8474
  paymentPort: 3105
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { cpu: 250m, memory: 64Mi }

# ─── Application services ────────────────────────────────────
# Each entry renders a Deployment + ClusterIP Service. image names match the
# compose project build output (ieeeyp-<service>).
services:
  product-catalog:
    image: ieeeyp-product-catalog
    port: 3001
    replicas: 1
    db: catalog_db
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 500m, memory: 128Mi }

  order-service:
    image: ieeeyp-order-service
    port: 3000
    replicas: 1
    db: orders_db
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 500m, memory: 128Mi }

  inventory-service:
    image: ieeeyp-inventory-service
    port: 3002
    replicas: 1
    db: inventory_db
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: "1", memory: 768Mi }

  payment-service:
    image: ieeeyp-payment-service
    port: 3004
    replicas: 1
    db: payments_db
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: "1", memory: 768Mi }

  payment-gateway:
    image: ieeeyp-payment-gateway
    port: 3005
    replicas: 1
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 250m, memory: 128Mi }

  notification-service:
    image: ieeeyp-notification-service
    port: 3003
    replicas: 1
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 250m, memory: 128Mi }

  api-gateway:
    image: ieeeyp-api-gateway
    port: 8080
    replicas: 1
    # Reached from the host through the Ingress above, not a NodePort.
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 250m, memory: 128Mi }

# ─── Observability (LGTM stack — parity with docker-compose) ──
# The OTel Collector + Tempo + Loki + Prometheus + Grafana. When enabled, the
# services above are also handed OTEL_* env (see templates/services.yaml) so
# their SDKs/agents export here instead of the localhost default.
#
# Config files are NOT vendored into the chart: they live at repo-root
# observability/ as the single source of truth shared with Compose. Helm cannot
# read outside the chart dir, so each file's content is injected at install time
# via `helm --set-file observability.configs.<key>=observability/<file>`. Use
# deploy/helm/install.ps1 (or install.sh), which wires all nine. A bare
# `helm install` leaves configs empty and the `required` guards in the
# ConfigMap templates fail fast rather than rendering broken configs.
#
# Storage is emptyDir for every backend: this is a local demo, and dashboards /
# datasources are re-provisioned from ConfigMaps on each restart, so nothing of
# value is lost when a pod recycles. Tempo/Loki/Prometheus/Grafana run as root
# because their images' non-root default users cannot write to an emptyDir mount
# (Compose already runs tempo/loki as user 0:0 for the same reason).
observability:
  enabled: true

  otelCollector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  tempo:
    image: grafana/tempo:2.6.0
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  loki:
    image: grafana/loki:3.2.0
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  prometheus:
    image: prom/prometheus:v2.54.1
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }

  grafana:
    image: grafana/grafana:11.2.2
    # Local-only convenience: anonymous admin (matches Compose). Override for
    # anything beyond a laptop demo.
    adminUser: admin
    adminPassword: admin
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 500m, memory: 256Mi }

  # Populated at install time by --set-file (see install.ps1 / install.sh).
  # Left empty here on purpose: the ConfigMap templates wrap each value in
  # `required`, so a bare `helm install` fails with a clear message instead of
  # shipping empty configs.
  configs:
    otelCollector: ""
    tempo: ""
    loki: ""
    prometheus: ""
    grafanaDatasources: ""
    grafanaDashboardsProvider: ""
    dashboardServiceOverview: ""
    dashboardPostgresql: ""
    dashboardOrderOutcomes: ""

# ─── PostgreSQL metrics exporter ─────────────────────────────
# Exposes Postgres internals (connections, lock waits, transaction rates) as
# Prometheus metrics; --auto-discover-databases fans out across all four
# per-service databases. Rendered only when observability.enabled is true.
postgresExporter:
  image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { cpu: 250m, memory: 64Mi }
