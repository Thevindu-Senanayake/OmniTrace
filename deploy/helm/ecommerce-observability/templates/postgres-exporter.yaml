{{- /*
postgres_exporter — exposes PostgreSQL internals (connection counts, lock waits,
transaction rates) as Prometheus metrics; --auto-discover-databases fans out
across all four per-service databases, not just the one it connects to.
Credentials come from the same postgres-credentials Secret the app services use.
Scraped by Prometheus (postgres-exporter job) — the Service name must stay
`postgres-exporter` for that target to resolve. Rendered with the rest of the
observability tier.
*/ -}}
{{- if .Values.observability.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  labels:
    {{- include "eco.labels" . | nindent 4 }}
    {{- include "eco.selectorLabels" (dict "name" "postgres-exporter") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "eco.selectorLabels" (dict "name" "postgres-exporter") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "eco.labels" . | nindent 8 }}
        {{- include "eco.selectorLabels" (dict "name" "postgres-exporter") | nindent 8 }}
    spec:
      initContainers:
        # The exporter crashloops if Postgres is not yet accepting connections;
        # gate on it the same way the app services do.
        - name: wait-for-postgres
          image: {{ .Values.global.waitImage }}
          command: ["sh", "-c", "until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done"]
      containers:
        - name: postgres-exporter
          image: {{ .Values.postgresExporter.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: DATA_SOURCE_NAME
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/postgres?sslmode=disable"
            - name: PG_EXPORTER_AUTO_DISCOVER_DATABASES
              value: "true"
          ports:
            - name: metrics
              containerPort: 9187
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9187
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9187
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.postgresExporter.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  labels:
    {{- include "eco.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "eco.selectorLabels" (dict "name" "postgres-exporter") | nindent 4 }}
  ports:
    - name: metrics
      port: 9187
      targetPort: 9187
{{- end }}
