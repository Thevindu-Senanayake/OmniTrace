apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init
  labels:
    {{- include "eco.labels" . | nindent 4 }}
  annotations:
    # Run after the release installs/upgrades; retry until Kafka is reachable.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        {{- include "eco.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kafka-init
          image: {{ .Values.kafka.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - bash
            - -c
            - |
              set -e
              echo "waiting for kafka..."
              until kafka-broker-api-versions --bootstrap-server kafka:9092 >/dev/null 2>&1; do
                sleep 3
              done
              {{- range .Values.kafka.topics }}
              kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
                --topic {{ . }} --partitions {{ $.Values.kafka.partitions }} \
                --replication-factor {{ $.Values.kafka.replicationFactor }}
              {{- end }}
              echo "topics ready:"
              kafka-topics --bootstrap-server kafka:9092 --list
